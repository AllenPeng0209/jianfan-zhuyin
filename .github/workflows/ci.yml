name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/generate-data.py
      - run: cmake -S . -B build/EngineTests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/EngineTests --parallel 2
      - run: build/EngineTests/Vendor/McBopomofo/Source/Engine/McBopomofoLMLibTest
      - run: build/EngineTests/JianfanCoreTest
      - run: build/EngineTests/Vendor/McBopomofo/Source/Engine/Mandarin/MandarinTest
      - run: build/EngineTests/Vendor/McBopomofo/Source/Engine/gramambular2/gramambular2_test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/generate-data.py
      - run: cmake -S . -B build/Windows -A x64
      - run: cmake --build build/Windows --config Release --target JianfanCoreTest McBopomofoLMLibTest --parallel 4
      - run: build/Windows/Release/JianfanCoreTest.exe
      - run: build/Windows/Vendor/McBopomofo/Source/Engine/Release/McBopomofoLMLibTest.exe
      - run: cmake --build build/Windows --config Release --target WindowsCOMTest --parallel 4
      - run: build/Windows/platforms/windows/Release/WindowsCOMTest.exe
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - run: swift test --package-path Vendor/McBopomofo/Packages/JianfanUserData --scratch-path build/UserDataTests
      - run: bash scripts/test-macos.sh
      - run: bash scripts/build-local.sh
      - run: bash scripts/test-ios.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-build-results
          path: |
            build/logs/*.log
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 14
